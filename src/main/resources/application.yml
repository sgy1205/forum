server:
  port: 12050
  servlet:
    context-path: /

spring:
  web:
    socket:
      allow-origin: '*'
  redis:
    host: 127.0.0.1
    port: 6379
    database: 1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/forum?userSSL=false;serverTimezone=Asia/Shanghai
    username: root
    password: 12345
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# 设置日志级别
  logging:
    level.cn.smxy.forum.controller= DEBUG
    file.path=logs  # 输出到文件
mybatis-plus:
  type-aliases-package: cn.smxy.forum.domain
  config-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    cn.smxy.forum: debug
